<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Valley</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e8eaf0;
      --muted: #7b7f96;
      --accent: #6c8aff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    header p {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.4rem 1.6rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
      display: block;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .card p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem;
    }

    footer {
      margin-top: auto;
      padding-top: 3rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Animal Valley</h1>
    <p>Stians prosjekter og apper</p>
  </header>

  <main class="grid" id="apps">
    <a class="card" href="apps/surdeig/">
      <h2>🍞 Surdeigsbrød med spelt</h2>
      <p>Oppskrift med ingredienskalkulator for antall brød og hydrasjon. Lang kaldheving, jerngryte.</p>
    </a>
  </main>

  <footer>animalvalley.no</footer>
</body>
</html>
